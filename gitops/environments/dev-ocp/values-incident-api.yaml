# Incident API — OCP lab (shared postgres-ha, Harbor aiops project)
replicaCount: 1

image:
  repository: harbor-platform.apps.ocp01.npd.co/aiops/incident-api
  # tag: bumped via gitops/values-images.yaml (Jenkins Kaniko)
  pullPolicy: IfNotPresent

imagePullSecrets:
  - name: harbor-pull-secret

fullnameOverride: "incident-api"

route:
  enabled: true
  host: incident-api-aiops-core.apps.ocp01.npd.co
  timeout: "300s"

database:
  existingSecret: postgresql-credentials
  urlKey: DATABASE_URL

openai:
  existingSecret: openai-api-key
  secretKey: OPENAI_API_KEY
  model: gpt-4o-mini

llm:
  provider: ollama
  ollamaBaseUrl: "http://ollama.aiops-core.svc:11434"
  ollamaModel: "qwen2.5:3b"
  # Fail fast: ops ~3s + LLM ≤5s → 200 template trước tường ~120s (ERR_EMPTY_RESPONSE).
  # Tăng lại (45–75) sau khi qwen trả lời ổn định trên CPU.
  ollamaTimeoutSeconds: "5"
  chatEnabled: true
