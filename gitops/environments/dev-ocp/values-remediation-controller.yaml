# Remediation Controller overrides — OCP lab (Policy Mode B)
replicaCount: 1

image:
  repository: harbor-platform.apps.ocp01.npd.co/aiops/remediation-controller
  pullPolicy: IfNotPresent

imagePullSecrets:
  - name: harbor-pull-secret

serviceAccount:
  create: false
  name: remediation-controller

config:
  logLevel: INFO
  platformEnvironment: dev-ocp
  policyConfigMap: aiops-remediation-policy
  policyConfigMapKey: policy.yaml

amcSync:
  enabled: true
  schedule: "*/15 * * * *"
  serviceAccountName: aiops-amc-sync
  webhookUrl: http://incident-api.aiops-core.svc.cluster.local:8080/api/v1/alerts

route:
  enabled: true
  host: remediation-controller-aiops-automation.apps.ocp01.npd.co

resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

podSecurityContext:
  runAsNonRoot: true

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

volumes:
  tmp:
    enabled: true
    sizeLimit: 32Mi
