# RCA Agent overrides for OCP lab — referenced by Argo CD Application.

replicaCount: 1

image:
  # Phase 3: build qua Jenkins → Harbor (không dùng ghcr.io/kiettt4)
  repository: harbor-platform.apps.ocp01.npd.co/aiops/rca-agent
  tag: "0.1.0-skeleton"
  pullPolicy: IfNotPresent

serviceAccount:
  create: false
  name: rca-agent

resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    cpu: "1"
    memory: 2Gi

config:
  logLevel: INFO

  # Loaded from ConfigMap aiops-endpoints (envFrom)
  useExistingConfigMap: true
  existingConfigMapName: aiops-endpoints
  existingPlatformConfigMap: aiops-platform-config

openai:
  existingSecret: openai-api-key
  secretKey: OPENAI_API_KEY

route:
  enabled: false  # Enable when UI/API needs external access

probes:
  liveness:
    path: /health/live
    initialDelaySeconds: 10
    periodSeconds: 15
  readiness:
    path: /health/ready
    initialDelaySeconds: 5
    periodSeconds: 10

podSecurityContext:
  runAsNonRoot: true

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL
