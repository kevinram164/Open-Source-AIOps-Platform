# RCA Agent overrides — OCP lab (Harbor + shared OpenAI secret)
replicaCount: 1

image:
  repository: harbor-platform.apps.ocp01.npd.co/aiops/rca-agent
  pullPolicy: IfNotPresent

imagePullSecrets:
  - name: harbor-pull-secret

serviceAccount:
  create: false
  name: rca-agent

resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    cpu: "1"
    memory: 2Gi

config:
  logLevel: INFO
  useExistingConfigMap: true
  existingConfigMapName: aiops-endpoints
  existingPlatformConfigMap: aiops-platform-config

openai:
  existingSecret: openai-api-key
  secretKey: OPENAI_API_KEY

route:
  enabled: true
  host: rca-agent-aiops-core.apps.ocp01.npd.co

podSecurityContext:
  runAsNonRoot: true

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

volumes:
  tmp:
    enabled: true
    sizeLimit: 64Mi
