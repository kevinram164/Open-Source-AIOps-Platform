# Homelab child applications managed by aiops-homelab-root.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: aiops-bootstrap
  namespace: openshift-gitops
  labels:
    app.kubernetes.io/part-of: open-aiops-platform
spec:
  project: default
  source:
    repoURL: https://github.com/kiettt4/Open-Source-AIOps-Platform.git
    targetRevision: main
    path: bootstrap
  destination:
    server: https://kubernetes.default.svc
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: aiops-core
  namespace: openshift-gitops
  labels:
    app.kubernetes.io/part-of: open-aiops-platform
spec:
  project: default
  source:
    repoURL: https://github.com/kiettt4/Open-Source-AIOps-Platform.git
    targetRevision: main
    path: gitops/applications/aiops-core
  destination:
    server: https://kubernetes.default.svc
    namespace: aiops-core
  syncPolicy:
    syncOptions:
      - CreateNamespace=false
---
