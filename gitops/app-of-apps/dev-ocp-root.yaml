# Root App of Apps — AIOps on existing OCP lab (banking + movie).
# Update spec.source.repoURL to your Git remote before applying.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: aiops-dev-ocp-root
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: open-aiops-platform
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: aiops-platform
  source:
    repoURL: https://github.com/kevinram164/Open-Source-AIOps-Platform.git
    targetRevision: main
    path: gitops/app-of-apps/dev-ocp
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
