---
# Platform alerts (ns openshift-monitoring) — cần quyền cluster; sync thủ công nếu default project chặn
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: aiops-alertmanager-platform
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: open-aiops-platform
  annotations:
    argocd.argoproj.io/sync-wave: "20"
spec:
  project: aiops-platform
  source:
    repoURL: https://github.com/kevinram164/Open-Source-AIOps-Platform.git
    targetRevision: main
    path: integrations/alertmanager/overlays/openshift-monitoring
  destination:
    server: https://kubernetes.default.svc
    namespace: openshift-monitoring
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
      - ServerSideApply=true
