# AlertmanagerConfig → Incident API (banking + movie + platform monitoring)
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: aiops-alertmanager-banking
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: open-aiops-platform
  annotations:
    argocd.argoproj.io/sync-wave: "20"
spec:
  project: aiops-platform
  source:
    repoURL: https://github.com/kevinram164/Open-Source-AIOps-Platform.git
    targetRevision: main
    path: integrations/alertmanager/overlays/npd-banking
  destination:
    server: https://kubernetes.default.svc
    namespace: npd-banking
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: aiops-alertmanager-movie
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: open-aiops-platform
  annotations:
    argocd.argoproj.io/sync-wave: "20"
spec:
  project: aiops-platform
  source:
    repoURL: https://github.com/kevinram164/Open-Source-AIOps-Platform.git
    targetRevision: main
    path: integrations/alertmanager/overlays/npd-movie
