# Ollama LLM — dedicated Argo app (sync before rca-agent / incident-api chat).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: aiops-ollama
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: open-aiops-platform
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  project: default
  source:
    repoURL: https://github.com/kevinram164/Open-Source-AIOps-Platform.git
    targetRevision: main
    path: bootstrap/ollama
  destination:
    server: https://kubernetes.default.svc
    namespace: aiops-core
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
      - ServerSideApply=true
