# ESO for AIOps — Vault paths secret/aiops/*
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: aiops-vault-secrets
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: open-aiops-platform
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: aiops-platform
  source:
    repoURL: https://github.com/kevinram164/Open-Source-AIOps-Platform.git
    targetRevision: main
    path: vault/external-secrets
  destination:
    server: https://kubernetes.default.svc
    namespace: aiops-core
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
      - RespectNamespaceOverrides=true
