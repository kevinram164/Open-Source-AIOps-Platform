# Ollama — OpenShift restricted-compatible (no root, no fixed fsGroup).
# Uses emptyDir (writable by arbitrary UID). Model pulled on container start.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ollama
  namespace: aiops-core
  labels:
    app.kubernetes.io/name: ollama
    app.kubernetes.io/part-of: open-aiops-platform
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ollama
  namespace: aiops-core
  labels:
    app.kubernetes.io/name: ollama
    app.kubernetes.io/part-of: open-aiops-platform
  annotations:
    aiops.platform/ollama-datadir: "v5-emptydir-restricted"
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: ollama
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ollama
      annotations:
        aiops.platform/ollama-datadir: "v5-emptydir-restricted"
    spec:
      serviceAccountName: ollama
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: ollama
          image: docker.io/ollama/ollama:0.6.5
          ports:
            - name: http
              containerPort: 11434
          env:
            - name: HOME
              value: /var/lib/ollama
            - name: OLLAMA_MODELS
              value: /var/lib/ollama/models
            - name: OLLAMA_HOST
              value: "0.0.0.0:11434"
            - name: OLLAMA_KEEP_ALIVE
              value: "24h"
            - name: MODEL
              value: "qwen2.5:3b"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            runAsNonRoot: true
          # Serve + ensure model (emptyDir is wiped on reschedule → re-pull)
          command:
            - /bin/sh
            - -ec
            - |
              mkdir -p "${HOME}/models" "${HOME}/.ollama"
              ollama serve &
              pid=$!
              echo "Waiting for ollama API..."
              i=0
              until ollama list >/dev/null 2>&1; do
                i=$((i+1))
                if [ "$i" -gt 60 ]; then
                  echo "ollama serve failed to become ready"
                  kill "$pid" 2>/dev/null || true
                  exit 1
                fi
                sleep 2
              done
              if ! ollama list 2>/dev/null | grep -q "${MODEL}"; then
                echo "Pulling ${MODEL} (first start / new emptyDir)..."
                ollama pull "${MODEL}"
              else
                echo "Model ${MODEL} already present."
              fi
              ollama list
              wait "$pid"
          resources:
            requests:
              cpu: "1"
              memory: 4Gi
            limits:
              cpu: "4"
              memory: 8Gi
          volumeMounts:
            - name: data
              mountPath: /var/lib/ollama
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 30
            periodSeconds: 15
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 120
            periodSeconds: 30
            failureThreshold: 6
          startupProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 10
            failureThreshold: 60
      volumes:
        # Writable by OpenShift arbitrary UID; models re-pulled after pod recreate
        - name: data
          emptyDir:
            sizeLimit: 20Gi
---
apiVersion: v1
kind: Service
metadata:
  name: ollama
  namespace: aiops-core
  labels:
    app.kubernetes.io/name: ollama
    app.kubernetes.io/part-of: open-aiops-platform
spec:
  selector:
    app.kubernetes.io/name: ollama
  ports:
    - name: http
      port: 11434
      targetPort: http
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: ollama
  namespace: aiops-core
  labels:
    app.kubernetes.io/name: ollama
spec:
  to:
    kind: Service
    name: ollama
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
