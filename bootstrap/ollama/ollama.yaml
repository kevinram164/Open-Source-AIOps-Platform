# Ollama — OpenShift restricted (no root / no custom SCC).
# OpenShift random UID has no passwd home → ollama writes /.ollama.
# Fix: mount emptyDir at /.ollama (writable). Do NOT use runAsUser:0.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ollama
  namespace: aiops-core
  labels:
    app.kubernetes.io/name: ollama
    app.kubernetes.io/part-of: open-aiops-platform
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ollama
  namespace: aiops-core
  labels:
    app.kubernetes.io/name: ollama
    app.kubernetes.io/part-of: open-aiops-platform
  annotations:
    aiops.platform/ollama-datadir: "v8-num-parallel-1"
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: ollama
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ollama
      annotations:
        aiops.platform/ollama-datadir: "v8-num-parallel-1"
    spec:
      serviceAccountName: ollama
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: ollama
          image: docker.io/ollama/ollama:0.6.5
          ports:
            - name: http
              containerPort: 11434
          env:
            # Random UID → UserHomeDir is "/"; keep HOME off root FS
            - name: HOME
              value: /tmp
            - name: OLLAMA_MODELS
              value: /.ollama/models
            - name: OLLAMA_HOST
              value: "0.0.0.0:11434"
            - name: OLLAMA_KEEP_ALIVE
              value: "24h"
            # Default parallel=4 → n_ctx/4=2048 → truncates chat context → hang/500@3m
            - name: OLLAMA_NUM_PARALLEL
              value: "1"
            - name: OLLAMA_CONTEXT_LENGTH
              value: "4096"
            - name: MODEL
              value: "qwen2.5:3b"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            runAsNonRoot: true
          command:
            - /bin/sh
            - -ec
            - |
              export HOME=/tmp
              mkdir -p /.ollama/models
              ollama serve &
              pid=$!
              echo "Waiting for ollama API..."
              i=0
              until ollama list >/dev/null 2>&1; do
                i=$((i+1))
                if [ "$i" -gt 60 ]; then
                  echo "ollama serve failed to become ready"
                  kill "$pid" 2>/dev/null || true
                  exit 1
                fi
                sleep 2
              done
              if ! ollama list 2>/dev/null | grep -q "${MODEL}"; then
                echo "Pulling ${MODEL} (first start / new emptyDir)..."
                ollama pull "${MODEL}"
              else
                echo "Model ${MODEL} already present."
              fi
              ollama list
              wait "$pid"
          resources:
            requests:
              cpu: "1"
              memory: 4Gi
            limits:
              cpu: "4"
              memory: 12Gi
          volumeMounts:
            # Exact path from the error — kubelet mounts it writable for any UID
            - name: ollama-home
              mountPath: /.ollama
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 30
            periodSeconds: 15
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 120
            periodSeconds: 30
            failureThreshold: 6
          startupProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 10
            failureThreshold: 60
      volumes:
        - name: ollama-home
          emptyDir:
            sizeLimit: 20Gi
---
apiVersion: v1
kind: Service
metadata:
  name: ollama
  namespace: aiops-core
  labels:
    app.kubernetes.io/name: ollama
    app.kubernetes.io/part-of: open-aiops-platform
spec:
  selector:
    app.kubernetes.io/name: ollama
  ports:
    - name: http
      port: 11434
      targetPort: http
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: ollama
  namespace: aiops-core
  labels:
    app.kubernetes.io/name: ollama
    app.kubernetes.io/part-of: open-aiops-platform
spec:
  to:
    kind: Service
    name: ollama
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
