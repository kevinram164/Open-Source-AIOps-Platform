# Ollama — compatible with OpenShift restricted-v2 (no fixed fsGroup: 1000)
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ollama
  namespace: aiops-core
  labels:
    app.kubernetes.io/name: ollama
    app.kubernetes.io/part-of: open-aiops-platform
---
# SCC: allow any fsGroup so PVC is writable under restricted namespaces
apiVersion: security.openshift.io/v1
kind: SecurityContextConstraints
metadata:
  name: ollama-fs
  labels:
    app.kubernetes.io/name: ollama
    app.kubernetes.io/part-of: open-aiops-platform
allowHostDirVolumePlugin: false
allowHostIPC: false
allowHostNetwork: false
allowHostPID: false
allowHostPorts: false
allowPrivilegeEscalation: false
allowPrivilegedContainer: false
allowedCapabilities: null
defaultAddCapabilities: null
fsGroup:
  type: RunAsAny
groups: []
priority: null
readOnlyRootFilesystem: false
requiredDropCapabilities:
  - ALL
runAsUser:
  type: MustRunAsRange
seLinuxContext:
  type: MustRunAs
seccompProfiles:
  - runtime/default
supplementalGroups:
  type: RunAsAny
users:
  - system:serviceaccount:aiops-core:ollama
volumes:
  - configMap
  - downwardAPI
  - emptyDir
  - persistentVolumeClaim
  - projected
  - secret
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ollama-models
  namespace: aiops-core
  labels:
    app.kubernetes.io/name: ollama
    app.kubernetes.io/part-of: open-aiops-platform
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 40Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ollama
  namespace: aiops-core
  labels:
    app.kubernetes.io/name: ollama
    app.kubernetes.io/part-of: open-aiops-platform
  annotations:
    aiops.platform/ollama-datadir: "v3-scc-no-fixed-fsgroup"
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: ollama
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ollama
      annotations:
        aiops.platform/ollama-datadir: "v3-scc-no-fixed-fsgroup"
    spec:
      serviceAccountName: ollama
      # Do NOT set fsGroup: 1000 — restricted-v2 rejects it.
      # ollama-fs SCC (RunAsAny) + OpenShift will admit the pod.
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: ollama
          image: docker.io/ollama/ollama:0.6.5
          ports:
            - name: http
              containerPort: 11434
          env:
            - name: HOME
              value: /var/lib/ollama
            - name: OLLAMA_MODELS
              value: /var/lib/ollama/models
            - name: OLLAMA_HOST
              value: "0.0.0.0:11434"
            - name: OLLAMA_KEEP_ALIVE
              value: "30m"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            runAsNonRoot: true
          resources:
            requests:
              cpu: "1"
              memory: 4Gi
            limits:
              cpu: "4"
              memory: 8Gi
          volumeMounts:
            - name: models
              mountPath: /var/lib/ollama
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 20
            periodSeconds: 15
            failureThreshold: 12
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 60
            periodSeconds: 30
          lifecycle:
            postStart:
              exec:
                command:
                  - /bin/sh
                  - -ec
                  - mkdir -p /var/lib/ollama/models && chmod -R g+rwX /var/lib/ollama || true
      volumes:
        - name: models
          persistentVolumeClaim:
            claimName: ollama-models
---
apiVersion: v1
kind: Service
metadata:
  name: ollama
  namespace: aiops-core
  labels:
    app.kubernetes.io/name: ollama
    app.kubernetes.io/part-of: open-aiops-platform
spec:
  selector:
    app.kubernetes.io/name: ollama
  ports:
    - name: http
      port: 11434
      targetPort: http
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: ollama
  namespace: aiops-core
  labels:
    app.kubernetes.io/name: ollama
spec:
  to:
    kind: Service
    name: ollama
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
---
apiVersion: batch/v1
kind: Job
metadata:
  name: ollama-pull-qwen25-3b
  namespace: aiops-core
  labels:
    app.kubernetes.io/name: ollama
    app.kubernetes.io/component: model-pull
    app.kubernetes.io/part-of: open-aiops-platform
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 8
  ttlSecondsAfterFinished: 604800
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ollama
        app.kubernetes.io/component: model-pull
    spec:
      restartPolicy: OnFailure
      serviceAccountName: ollama
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: pull
          image: docker.io/ollama/ollama:0.6.5
          env:
            - name: HOME
              value: /tmp
            - name: OLLAMA_HOST
              value: "http://ollama.aiops-core.svc:11434"
            - name: MODEL
              value: "qwen2.5:3b"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            runAsNonRoot: true
          command:
            - /bin/sh
            - -ec
            - |
              echo "Waiting for Ollama at ${OLLAMA_HOST}..."
              i=0
              until ollama list >/dev/null 2>&1; do
                i=$((i+1))
                if [ "$i" -gt 90 ]; then
                  echo "timeout waiting for ollama"
                  exit 1
                fi
                sleep 5
              done
              echo "Pulling ${MODEL}..."
              ollama pull "${MODEL}"
              ollama list
              echo "Model ready."
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
