# Ollama in aiops-core — synced by Argo (aiops-ollama / bootstrap).
# Model pull Job downloads qwen2.5:3b once PVC is ready.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ollama-models
  namespace: aiops-core
  labels:
    app.kubernetes.io/name: ollama
    app.kubernetes.io/part-of: open-aiops-platform
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 40Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ollama
  namespace: aiops-core
  labels:
    app.kubernetes.io/name: ollama
    app.kubernetes.io/part-of: open-aiops-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: ollama
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ollama
    spec:
      containers:
        - name: ollama
          image: docker.io/ollama/ollama:0.6.5
          ports:
            - name: http
              containerPort: 11434
          env:
            - name: OLLAMA_HOST
              value: "0.0.0.0:11434"
            - name: OLLAMA_KEEP_ALIVE
              value: "30m"
            - name: OLLAMA_MODELS
              value: "qwen2.5:3b"
          resources:
            requests:
              cpu: "1"
              memory: 4Gi
            limits:
              cpu: "4"
              memory: 8Gi
          volumeMounts:
            - name: models
              mountPath: /root/.ollama
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 15
            periodSeconds: 15
            failureThreshold: 12
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 60
            periodSeconds: 30
      volumes:
        - name: models
          persistentVolumeClaim:
            claimName: ollama-models
---
apiVersion: v1
kind: Service
metadata:
  name: ollama
  namespace: aiops-core
  labels:
    app.kubernetes.io/name: ollama
    app.kubernetes.io/part-of: open-aiops-platform
spec:
  selector:
    app.kubernetes.io/name: ollama
  ports:
    - name: http
      port: 11434
      targetPort: http
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: ollama
  namespace: aiops-core
  labels:
    app.kubernetes.io/name: ollama
spec:
  to:
    kind: Service
    name: ollama
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
---
# Pull model after Service is up. Re-run: delete job then sync Argo.
apiVersion: batch/v1
kind: Job
metadata:
  name: ollama-pull-qwen25-3b
  namespace: aiops-core
  labels:
    app.kubernetes.io/name: ollama
    app.kubernetes.io/component: model-pull
    app.kubernetes.io/part-of: open-aiops-platform
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 6
  ttlSecondsAfterFinished: 604800
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ollama
        app.kubernetes.io/component: model-pull
    spec:
      restartPolicy: OnFailure
      containers:
        - name: pull
          image: docker.io/ollama/ollama:0.6.5
          env:
            - name: OLLAMA_HOST
              value: "http://ollama.aiops-core.svc:11434"
            - name: MODEL
              value: "qwen2.5:3b"
          command:
            - /bin/sh
            - -ec
            - |
              echo "Waiting for Ollama at ${OLLAMA_HOST}..."
              i=0
              until ollama list >/dev/null 2>&1; do
                i=$((i+1))
                if [ "$i" -gt 60 ]; then
                  echo "timeout waiting for ollama"
                  exit 1
                fi
                sleep 5
              done
              echo "Pulling ${MODEL}..."
              ollama pull "${MODEL}"
              ollama list
              echo "Model ready."
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
