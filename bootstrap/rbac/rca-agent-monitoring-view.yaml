# Optional: allow rca-agent to query Thanos/Prometheus (OpenShift)
# Apply: oc apply -f bootstrap/rbac/rca-agent-monitoring-view.yaml
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: rca-agent-cluster-monitoring-view
  labels:
    app.kubernetes.io/name: rca-agent
    app.kubernetes.io/part-of: open-aiops-platform
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-monitoring-view
subjects:
  - kind: ServiceAccount
    name: rca-agent
    namespace: aiops-core
