apiVersion: v1
kind: ServiceAccount
metadata:
  name: remediation-controller
  namespace: aiops-automation
  labels:
    app.kubernetes.io/name: remediation-controller
    app.kubernetes.io/part-of: open-aiops-platform
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: remediation-controller
  labels:
    app.kubernetes.io/part-of: open-aiops-platform
rules:
  - apiGroups: ["apps"]
    resources: ["deployments", "deployments/scale"]
    verbs: ["get", "list", "patch", "update"]
  - apiGroups: [""]
    resources: ["namespaces", "pods"]
    verbs: ["get", "list"]
  - apiGroups: ["monitoring.coreos.com"]
    resources: ["alertmanagerconfigs"]
    verbs: ["get", "list", "create", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: remediation-controller
  labels:
    app.kubernetes.io/part-of: open-aiops-platform
subjects:
  - kind: ServiceAccount
    name: remediation-controller
    namespace: aiops-automation
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: remediation-controller
---
# AMC sync job uses same SA
apiVersion: v1
kind: ServiceAccount
metadata:
  name: aiops-amc-sync
  namespace: aiops-automation
  labels:
    app.kubernetes.io/part-of: open-aiops-platform
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: aiops-amc-sync
  labels:
    app.kubernetes.io/part-of: open-aiops-platform
subjects:
  - kind: ServiceAccount
    name: aiops-amc-sync
    namespace: aiops-automation
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: remediation-controller
