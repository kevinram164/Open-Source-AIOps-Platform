# NetworkPolicy for aiops-core — ingress restrictive; egress open (lab).
# Tránh chặn DNS/postgres-ha (gaierror Temporary failure in name resolution).
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: aiops-core-default-deny-ingress
  namespace: aiops-core
  labels:
    app.kubernetes.io/part-of: open-aiops-platform
spec:
  podSelector: {}
  policyTypes:
    - Ingress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: aiops-core-allow-internal
  namespace: aiops-core
  labels:
    app.kubernetes.io/part-of: open-aiops-platform
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector: {}
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: aiops-observability
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: aiops-automation
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: openshift-ingress
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: openshift-monitoring
---
# Egress: không restrict (lab). Xóa policy egress cũ nếu còn.
