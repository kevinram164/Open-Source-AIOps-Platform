# NetworkPolicy aiops-core — ingress only (lab: không restrict egress).
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: aiops-core-default-deny-ingress
  namespace: aiops-core
  labels:
    app.kubernetes.io/part-of: open-aiops-platform
spec:
  podSelector: {}
  policyTypes:
    - Ingress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: aiops-core-allow-internal
  namespace: aiops-core
  labels:
    app.kubernetes.io/part-of: open-aiops-platform
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector: {}
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: aiops-observability
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: aiops-automation
    # OpenShift router (label chuẩn — không chỉ dựa ns name)
    - from:
        - namespaceSelector:
            matchLabels:
              network.openshift.io/policy-group: ingress
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: openshift-ingress
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: openshift-monitoring
