---
# Lab: chỉ restrict ingress (giống aiops-core). Egress tự do → DNS + Postgres OK.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: aiops-observability-default-deny-ingress
  namespace: aiops-observability
  labels:
    app.kubernetes.io/part-of: open-aiops-platform
spec:
  podSelector: {}
  policyTypes:
    - Ingress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: aiops-observability-allow
  namespace: aiops-observability
  labels:
    app.kubernetes.io/part-of: open-aiops-platform
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              network.openshift.io/policy-group: ingress
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: openshift-ingress
    - from:
        - podSelector: {}
