---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: aiops-observability-default-deny-ingress
  namespace: aiops-observability
  labels:
    app.kubernetes.io/part-of: open-aiops-platform
spec:
  podSelector: {}
  policyTypes:
    - Ingress
---
# Grafana needs DNS (openshift-dns :5353 after DNAT) + Postgres + Thanos.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: aiops-observability-allow
  namespace: aiops-observability
  labels:
    app.kubernetes.io/part-of: open-aiops-platform
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              network.openshift.io/policy-group: ingress
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: openshift-ingress
    - from:
        - podSelector: {}
  egress:
    # In-namespace
    - to:
        - podSelector: {}
    # OpenShift DNS (ClusterIP :53 → pod :5353) — thiếu rule này → lookup "Try again"
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: openshift-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
        - protocol: UDP
          port: 5353
        - protocol: TCP
          port: 5353
    # Shared postgres-ha
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: postgres
      ports:
        - protocol: TCP
          port: 5432
    # Thanos / Prometheus
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: openshift-monitoring
      ports:
        - protocol: TCP
          port: 9091
        - protocol: TCP
          port: 9092
        - protocol: TCP
          port: 443
    # Optional: Incident API
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: aiops-core
      ports:
        - protocol: TCP
          port: 8080
