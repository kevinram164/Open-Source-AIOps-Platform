apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: grafana-data
  namespace: aiops-observability
  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/component: dashboard
    app.kubernetes.io/part-of: open-aiops-platform
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
  storageClassName: nfs-csi
