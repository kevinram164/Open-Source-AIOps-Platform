# AIOps Policy Mode B
# Observe (Alertmanager/AMC): hầu hết cluster trừ system (openshift-/kube-).
# Remediation (write): cấm platform/infra — vault được theo dõi nhưng không auto-fix.
apiVersion: v1
kind: ConfigMap
metadata:
  name: aiops-remediation-policy
  namespace: aiops-automation
  labels:
    app.kubernetes.io/part-of: open-aiops-platform
    aiops.platform/policy-mode: "B"
data:
  policy.yaml: |
    policyMode: B
    requireApproval: true

    # --- Observe / AMC sync / alert ingest ---
    # Vault, Argo, Harbor, Postgres… VẪN nhận AlertmanagerConfig → Incident API.
    observeDenyNamespacePrefixes:
      - openshift-
      - kube-
    observeDenyNamespaces: []

    # --- Remediation (restart / scale / gitops / runbook write) ---
    remediationDenyNamespacePrefixes:
      - openshift-
      - kube-
    remediationDenyNamespaces:
      - default
      - vault
      - argocd
      - external-secrets
      - platform
      - harbor
      - postgres
      - redis
      - kong
      - minio
      - observability
      - aiops-core
      - aiops-automation
      - aiops-observability

    allowedActions:
      - restart-deployment
      - scale-deployment
      - gitops-scale
      - ansible-runbook
    maxScaleReplicas: 10
