# External service endpoints — update after Phase 0 discovery.
apiVersion: v1
kind: ConfigMap
metadata:
  name: aiops-endpoints
  namespace: aiops-core
  labels:
    app.kubernetes.io/part-of: open-aiops-platform
data:
  # OpenShift Prometheus / Thanos Querier
  # Internal service URL (preferred for in-cluster access)
  PROMETHEUS_URL: "https://thanos-querier.openshift-monitoring.svc:9091"
  # Alternative: use route hostname after discovery
  # PROMETHEUS_URL: "https://thanos-querier-openshift-monitoring.apps.<cluster-domain>"

  # Alertmanager (for reference — webhook is inbound)
  ALERTMANAGER_URL: "https://alertmanager-main.openshift-monitoring.svc:9094"

  # Coroot CE — OCP lab (ns observability, release coroot)
  COROOT_URL: "http://coroot-coroot.observability.svc:8080"
  # COROOT_URL: "https://coroot-observability.apps.ocp01.npd.co"
  COROOT_NAMESPACE: "observability"
  # Phase 7B — live topology (set project id from Coroot URL: /p/<id>/...)
  COROOT_TOPOLOGY_ENABLED: "true"
  COROOT_PROJECT_ID: "8v7g4sa1"
  # Optional if Coroot requires login (anonymous labs leave blank)
  # COROOT_EMAIL: "admin@example.com"
  # COROOT_PASSWORD: "change-me"

  # Incident API (internal)
  INCIDENT_API_URL: "http://incident-api.aiops-core.svc:8080"

  # RCA Agent (Phase 3)
  RCA_AGENT_URL: "http://rca-agent.aiops-core.svc:8080"

  # Local LLM (optional — see docs/ollama.md)
  OLLAMA_URL: "http://ollama.aiops-core.svc:11434"

  # Remediation Controller (Phase 4) — NBA drafts
  REMEDIATION_CONTROLLER_URL: "http://remediation-controller.aiops-automation.svc:8080"

  # Shared postgres-ha (banking + movie) — DB name aiops
  POSTGRESQL_HOST: "postgres-ha-postgresql-primary.postgres.svc.cluster.local"
  POSTGRESQL_PORT: "5432"
  POSTGRESQL_DATABASE: "aiops"
