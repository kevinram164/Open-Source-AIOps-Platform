# OpenShift platform monitoring — UWM + AlertmanagerConfig từ user namespaces.
# Field enableUserWorkload + alertmanagerMain (không đặt enableUserAlertmanagerConfig top-level).
apiVersion: v1
kind: ConfigMap
metadata:
  name: cluster-monitoring-config
  namespace: openshift-monitoring
  labels:
    app.kubernetes.io/part-of: open-aiops-platform
    app.kubernetes.io/component: alertmanager-integration
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
data:
  config.yaml: |
    enableUserWorkload: true
    alertmanagerMain:
      enableUserAlertmanagerConfig: true
