worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /tmp/nginx.pid;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  sendfile on;
  client_body_temp_path /tmp/client_temp;
  proxy_temp_path /tmp/proxy_temp;
  fastcgi_temp_path /tmp/fastcgi_temp;
  uwsgi_temp_path /tmp/uwsgi_temp;
  scgi_temp_path /tmp/scgi_temp;

  upstream incident_api {
    server incident-api.aiops-core.svc.cluster.local:8080;
  }
  upstream remediation_api {
    server remediation-controller.aiops-automation.svc.cluster.local:8080;
  }

  server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location /api/v1/chat {
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_connect_timeout 10s;
      proxy_send_timeout 300s;
      proxy_read_timeout 300s;
      proxy_pass http://incident_api;
    }
    location /api/v1/incidents {
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_read_timeout 120s;
      proxy_pass http://incident_api;
    }
    location /api/v1/alerts {
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_pass http://incident_api;
    }
    location /api/v1/remediations {
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_read_timeout 300s;
      proxy_pass http://remediation_api;
    }
    location /api/v1/policy {
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_pass http://remediation_api;
    }

    location / {
      try_files $uri $uri/ /index.html;
    }
  }
}
