---
# AIOps node diagnostics (reference playbook).
# Lab executes an equivalent kubectl Job via remediation action ansible-runbook.
- name: Node diagnostics
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    target_node: "{{ node | default('') }}"
  tasks:
    - name: List nodes
      command: kubectl get nodes -o wide
      register: nodes_out
      changed_when: false

    - name: Show nodes
      debug:
        var: nodes_out.stdout_lines

    - name: Describe node
      when: target_node | length > 0
      command: kubectl describe node "{{ target_node }}"
      register: desc_out
      changed_when: false

    - name: Warning events
      command: kubectl get events -A --field-selector type=Warning
      register: ev_out
      changed_when: false
      failed_when: false
