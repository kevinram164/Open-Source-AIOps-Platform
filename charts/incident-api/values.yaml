replicaCount: 1

image:
  repository: harbor-platform.apps.ocp01.npd.co/aiops/incident-api
  tag: "0.2.0"
  pullPolicy: IfNotPresent

imagePullSecrets:
  - name: harbor-pull-secret

nameOverride: ""
fullnameOverride: "incident-api"

podSecurityContext:
  runAsNonRoot: true

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

service:
  type: ClusterIP
  port: 8080

route:
  enabled: false
  host: ""
  timeout: "300s"
  annotations: {}
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 1Gi

config:
  logLevel: INFO
  correlationTimeWindowSeconds: 300
  correlationMaxAlertsPerIncident: 50
  nbaEnabled: true

openai:
  existingSecret: ""
  secretKey: OPENAI_API_KEY
  model: gpt-4o-mini

llm:
  provider: ollama
  ollamaBaseUrl: "http://ollama.aiops-core.svc:11434"
  ollamaModel: "qwen2.5:3b"

database:
  existingSecret: postgresql-credentials
  urlKey: DATABASE_URL
