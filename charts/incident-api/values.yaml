replicaCount: 1

image:
  repository: harbor-platform.apps.ocp01.npd.co/aiops/incident-api
  tag: "0.2.0"
  pullPolicy: IfNotPresent

imagePullSecrets:
  - name: harbor-pull-secret

nameOverride: ""
fullnameOverride: "incident-api"

podSecurityContext:
  runAsNonRoot: true

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

service:
  type: ClusterIP
  port: 8080

route:
  enabled: false
  host: ""
  timeout: "300s"
  annotations: {}
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 1Gi

config:
  logLevel: INFO
  correlationTimeWindowSeconds: 300
  correlationMaxAlertsPerIncident: 50
  nbaEnabled: true

# OTLP → shared collector (Coroot + Instana). Empty endpoint disables tracing.
otel:
  enabled: true
  endpoint: "http://opentelemetry-collector.observability.svc.cluster.local:4317"
  protocol: "grpc"
  serviceName: "incident-api"
  resourceAttributes: "deployment.environment=dev-ocp,k8s.namespace.name=aiops-core,k8s.cluster.name=ocp01"
  heartbeat: true
  heartbeatSeconds: 30

openai:
  existingSecret: ""
  secretKey: OPENAI_API_KEY
  model: gpt-4o-mini

llm:
  provider: ollama
  ollamaBaseUrl: "http://ollama.aiops-core.svc:11434"
  ollamaModel: "qwen2.5:3b"

database:
  existingSecret: postgresql-credentials
  urlKey: DATABASE_URL
