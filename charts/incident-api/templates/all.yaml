apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "incident-api.fullname" . }}
  labels:
    {{- include "incident-api.labels" . | nindent 4 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "incident-api.fullname" . }}
  labels:
    {{- include "incident-api.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "incident-api.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "incident-api.selectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "incident-api.fullname" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: incident-api
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
          env:
            - name: LOG_LEVEL
              value: {{ .Values.config.logLevel | quote }}
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.database.existingSecret }}
                  key: {{ .Values.database.urlKey }}
            - name: CORRELATION_TIME_WINDOW_SECONDS
              value: {{ .Values.config.correlationTimeWindowSeconds | quote }}
            - name: CORRELATION_MAX_ALERTS_PER_INCIDENT
              value: {{ .Values.config.correlationMaxAlertsPerIncident | quote }}
            - name: PLATFORM_ENVIRONMENT
              valueFrom:
                configMapKeyRef:
                  name: aiops-platform-config
                  key: PLATFORM_ENVIRONMENT
                  optional: true
            - name: RCA_AGENT_URL
              valueFrom:
                configMapKeyRef:
                  name: aiops-endpoints
                  key: RCA_AGENT_URL
                  optional: true
            - name: REMEDIATION_CONTROLLER_URL
              valueFrom:
                configMapKeyRef:
                  name: aiops-endpoints
                  key: REMEDIATION_CONTROLLER_URL
                  optional: true
            - name: NBA_ENABLED
              value: {{ .Values.config.nbaEnabled | default true | quote }}
            - name: LLM_PROVIDER
              value: {{ .Values.llm.provider | default "openai" | quote }}
            {{- if eq (.Values.llm.provider | default "openai") "ollama" }}
            - name: OLLAMA_BASE_URL
              value: {{ .Values.llm.ollamaBaseUrl | default "http://ollama.aiops-core.svc:11434" | quote }}
            - name: OLLAMA_MODEL
              value: {{ .Values.llm.ollamaModel | default "qwen2.5:3b" | quote }}
            - name: OLLAMA_TIMEOUT_SECONDS
              value: {{ .Values.llm.ollamaTimeoutSeconds | default "45" | quote }}
            - name: CHAT_LLM_ENABLED
              value: {{ .Values.llm.chatEnabled | default true | quote }}
            {{- end }}
            {{- if and .Values.otel.enabled .Values.otel.endpoint }}
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: {{ .Values.otel.endpoint | quote }}
            - name: OTEL_EXPORTER_OTLP_PROTOCOL
              value: {{ .Values.otel.protocol | default "grpc" | quote }}
            - name: OTEL_SERVICE_NAME
              value: {{ .Values.otel.serviceName | default "incident-api" | quote }}
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: {{ .Values.otel.resourceAttributes | quote }}
            - name: OTEL_HEARTBEAT
              value: {{ ternary "1" "0" (default true .Values.otel.heartbeat) | quote }}
            - name: OTEL_HEARTBEAT_SECONDS
              value: {{ .Values.otel.heartbeatSeconds | default 30 | quote }}
            {{- end }}
            {{- if .Values.openai.existingSecret }}
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.openai.existingSecret }}
                  key: {{ .Values.openai.secretKey }}
                  optional: true
            - name: OPENAI_MODEL
              value: {{ .Values.openai.model | default "gpt-4o-mini" | quote }}
            {{- end }}
          {{- if .Values.imagePullSecrets }}
          {{- end }}
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "incident-api.fullname" . }}
  labels:
    {{- include "incident-api.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: http
      name: http
  selector:
    {{- include "incident-api.selectorLabels" . | nindent 4 }}
{{- if .Values.route.enabled }}
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: {{ include "incident-api.fullname" . }}
  labels:
    {{- include "incident-api.labels" . | nindent 4 }}
  annotations:
    haproxy.router.openshift.io/timeout: {{ .Values.route.timeout | default "300s" | quote }}
    {{- with .Values.route.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  host: {{ .Values.route.host | quote }}
  to:
    kind: Service
    name: {{ include "incident-api.fullname" . }}
  port:
    targetPort: http
  tls:
    termination: {{ .Values.route.tls.termination }}
    insecureEdgeTerminationPolicy: {{ .Values.route.tls.insecureEdgeTerminationPolicy }}
{{- end }}
