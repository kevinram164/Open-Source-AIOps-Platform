replicaCount: 1

image:
  repository: docker.io/grafana/grafana
  tag: "11.3.0"
  pullPolicy: IfNotPresent

imagePullSecrets: []

fullnameOverride: grafana

serviceAccount:
  create: true
  name: grafana

service:
  type: ClusterIP
  port: 3000

route:
  enabled: true
  host: ""
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect

# OCP restricted-v2: prefer emptyDir (arbitrary UID). PVC+fsGroup:472 bị SCC chặn.
persistence:
  enabled: false
  existingClaim: grafana-data

admin:
  existingSecret: grafana-admin
  userKey: admin-user
  passwordKey: admin-password

postgres:
  existingSecret: grafana-postgres
  host: postgres-ha-postgresql-primary.postgres.svc.cluster.local
  port: "5432"
  database: aiops
  userKey: username
  passwordKey: password

# OpenShift restricted-v2 compatible (no fsGroup 472)
podSecurityContext:
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  runAsNonRoot: true
  capabilities:
    drop:
      - ALL
  seccompProfile:
    type: RuntimeDefault

resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

nodeSelector: {}
tolerations: []
affinity: {}
