apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "remediation-controller.fullname" . }}
  labels:
    {{- include "remediation-controller.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "remediation-controller.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "remediation-controller.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ .Values.serviceAccount.name }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: remediation-controller
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
              protocol: TCP
          env:
            - name: LOG_LEVEL
              value: {{ .Values.config.logLevel | quote }}
            - name: POLICY_PATH
              value: /policy/policy.yaml
            - name: GITOPS_TARGETS_PATH
              value: /gitops/targets.yaml
            - name: PLATFORM_ENVIRONMENT
              value: {{ .Values.config.platformEnvironment | default "dev-ocp" | quote }}
            - name: ANSIBLE_JOB_NAMESPACE
              value: {{ .Release.Namespace | quote }}
            - name: ANSIBLE_JOB_SERVICE_ACCOUNT
              value: {{ .Values.serviceAccount.name | quote }}
            - name: ANSIBLE_JOB_IMAGE
              value: {{ .Values.ansible.jobImage | quote }}
            {{- if .Values.database.existingSecret }}
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.database.existingSecret }}
                  key: {{ .Values.database.urlKey }}
            {{- end }}
            {{- if .Values.github.existingSecret }}
            - name: GITHUB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.github.existingSecret }}
                  key: {{ .Values.github.tokenKey }}
            - name: GITHUB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.github.existingSecret }}
                  key: {{ .Values.github.usernameKey }}
            {{- end }}
          livenessProbe:
            httpGet:
              path: {{ .Values.probes.liveness.path }}
              port: http
            initialDelaySeconds: {{ .Values.probes.liveness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.liveness.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.liveness.timeoutSeconds }}
            failureThreshold: {{ .Values.probes.liveness.failureThreshold }}
          readinessProbe:
            httpGet:
              path: {{ .Values.probes.readiness.path }}
              port: http
            initialDelaySeconds: {{ .Values.probes.readiness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.readiness.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.readiness.timeoutSeconds }}
            failureThreshold: {{ .Values.probes.readiness.failureThreshold }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: policy
              mountPath: /policy
              readOnly: true
            - name: gitops
              mountPath: /gitops
              readOnly: true
            {{- if .Values.volumes.tmp.enabled }}
            - name: tmp
              mountPath: /tmp
            {{- end }}
      volumes:
        - name: policy
          configMap:
            name: {{ .Values.config.policyConfigMap }}
            items:
              - key: {{ .Values.config.policyConfigMapKey }}
                path: policy.yaml
        - name: gitops
          configMap:
            name: {{ .Values.config.gitopsTargetsConfigMap }}
            items:
              - key: {{ .Values.config.gitopsTargetsKey }}
                path: targets.yaml
        {{- if .Values.volumes.tmp.enabled }}
        - name: tmp
          emptyDir:
            sizeLimit: {{ .Values.volumes.tmp.sizeLimit }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
