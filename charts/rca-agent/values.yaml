# Default values for rca-agent.
replicaCount: 1

image:
  repository: harbor-platform.apps.ocp01.npd.co/aiops/rca-agent
  tag: "0.3.0"
  pullPolicy: IfNotPresent

imagePullSecrets:
  - name: harbor-pull-secret

nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: false
  name: rca-agent
  annotations: {}

podAnnotations: {}
podLabels: {}

podSecurityContext:
  runAsNonRoot: true

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

service:
  type: ClusterIP
  port: 8080

route:
  enabled: false
  host: ""
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect

resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    cpu: "1"
    memory: 2Gi

config:
  logLevel: INFO
  useExistingConfigMap: true
  existingConfigMapName: aiops-endpoints
  existingPlatformConfigMap: aiops-platform-config

otel:
  enabled: true
  endpoint: "http://opentelemetry-collector.observability.svc.cluster.local:4317"
  protocol: "grpc"
  serviceName: "rca-agent"
  resourceAttributes: "deployment.environment=dev-ocp,k8s.namespace.name=aiops-core,k8s.cluster.name=ocp01"

openai:
  existingSecret: openai-api-key
  secretKey: OPENAI_API_KEY

llm:
  # openai | ollama — platform ConfigMap LLM_PROVIDER can override via envFrom
  provider: ollama
  ollamaBaseUrl: "http://ollama.aiops-core.svc:11434"
  ollamaModel: "qwen2.5:3b"

probes:
  liveness:
    path: /health/live
    initialDelaySeconds: 10
    periodSeconds: 15
    timeoutSeconds: 5
    failureThreshold: 3
  readiness:
    path: /health/ready
    initialDelaySeconds: 5
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3

topologySpreadConstraints:
  - maxSkew: 1
    topologyKey: kubernetes.io/hostname
    whenUnsatisfiable: ScheduleAnyway
    labelSelector:
      matchLabels:
        app.kubernetes.io/name: rca-agent

volumes:
  tmp:
    enabled: true
    sizeLimit: 64Mi

nodeSelector: {}
tolerations: []
affinity: {}
