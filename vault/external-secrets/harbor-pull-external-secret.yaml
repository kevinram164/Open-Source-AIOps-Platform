# Vault → dockerconfigjson harbor-pull-secret (ns aiops-core)
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: harbor-pull-secret
  namespace: aiops-core
  labels:
    app.kubernetes.io/part-of: open-aiops-platform
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: harbor-pull-secret
    creationPolicy: Owner
    template:
      type: kubernetes.io/dockerconfigjson
      engineVersion: v2
      data:
        .dockerconfigjson: '{{ printf "{\"auths\":{\"%s\":{\"username\":\"%s\",\"password\":\"%s\",\"auth\":\"%s\"}}}" .registry .username .password (printf "%s:%s" .username .password | b64enc) }}'
  data:
    - secretKey: registry
      remoteRef:
        key: aiops/harbor-pull
        property: registry
    - secretKey: username
      remoteRef:
        key: aiops/harbor-pull
        property: username
    - secretKey: password
      remoteRef:
        key: aiops/harbor-pull
        property: password
