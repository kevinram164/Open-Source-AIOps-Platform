# Vault secret/platform/github → github-credentials (ns aiops-automation)
# Keys: username + pat (same as Jenkins GitOps)
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: github-credentials
  namespace: aiops-automation
  labels:
    app.kubernetes.io/part-of: open-aiops-platform
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: github-credentials
    creationPolicy: Owner
  data:
    - secretKey: username
      remoteRef:
        key: platform/github
        property: username
    - secretKey: pat
      remoteRef:
        key: platform/github
        property: pat
