# Vault secret/aiops/openai → openai-api-key (ns aiops-core)
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: openai-api-key
  namespace: aiops-core
  labels:
    app.kubernetes.io/part-of: open-aiops-platform
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: openai-api-key
    creationPolicy: Owner
  data:
    - secretKey: OPENAI_API_KEY
      remoteRef:
        key: aiops/openai
        property: OPENAI_API_KEY
