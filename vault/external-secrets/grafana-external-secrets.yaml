# Grafana admin (lab) — seed Vault: vault kv put secret/aiops/grafana admin-user=admin admin-password='...'
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: grafana-admin
  namespace: aiops-observability
  labels:
    app.kubernetes.io/part-of: open-aiops-platform
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: grafana-admin
    creationPolicy: Owner
  data:
    - secretKey: admin-user
      remoteRef:
        key: aiops/grafana
        property: admin-user
    - secretKey: admin-password
      remoteRef:
        key: aiops/grafana
        property: admin-password
---
# Postgres for Grafana panels (role aiops, password from secret/aiops/db)
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: grafana-postgres
  namespace: aiops-observability
  labels:
    app.kubernetes.io/part-of: open-aiops-platform
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: grafana-postgres
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        username: "aiops"
        password: "{{ .password }}"
  data:
    - secretKey: password
      remoteRef:
        key: aiops/db
        property: password
