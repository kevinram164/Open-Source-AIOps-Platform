# Vault secret/aiops/db → Secret aiops-db (ns postgres) cho Job db-init
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: aiops-db
  namespace: postgres
  labels:
    app.kubernetes.io/part-of: open-aiops-platform
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: aiops-db
    creationPolicy: Owner
  data:
    - secretKey: password
      remoteRef:
        key: aiops/db
        property: password
